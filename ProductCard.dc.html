<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<sc-if value="{{ product.isDefault }}" hint-placeholder-val="{{ true }}">
<div data-href="{{ product.href }}" style="cursor:pointer;display:flex;flex-direction:column;background:#ffffff;border:1px solid #e3eaeb;border-radius:10px;overflow:hidden;height:100%;box-sizing:border-box;transition:border-color .25s, box-shadow .25s, transform .25s;font-family:'DM Sans',system-ui,sans-serif" style-hover="border-color:#1d989f;box-shadow:0 14px 30px rgba(29,152,159,0.14);transform:translateY(-3px)">
  <div style="position:relative;aspect-ratio:1 / 1;background:#f3f7f7">
    <sc-if value="{{ product.showSlot }}" hint-placeholder-val="{{ true }}"><image-slot id="p-{{ product.id }}" shape="rect" fit="{{ product.fit }}" src="{{ product.img }}" placeholder="{{ product.ph }}"></image-slot></sc-if>
    <sc-if value="{{ product.showIcon }}" hint-placeholder-val="{{ false }}"><div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#eef6f7">
      <sc-if value="{{ product.icEmboss }}" hint-placeholder-val="{{ false }}"><svg width="96" height="96" viewBox="0 0 64 64" fill="none" stroke="#1d989f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 8h30l6 6v42H14z"></path><path d="M44 8v6h6"></path><circle cx="24" cy="24" r="1.5"></circle><circle cx="32" cy="24" r="1.5"></circle><circle cx="40" cy="24" r="1.5"></circle><circle cx="24" cy="33" r="1.5"></circle><circle cx="32" cy="33" r="1.5"></circle><circle cx="40" cy="33" r="1.5"></circle><circle cx="24" cy="42" r="1.5"></circle><circle cx="32" cy="42" r="1.5"></circle><circle cx="40" cy="42" r="1.5"></circle></svg></sc-if>
      <sc-if value="{{ product.icSmooth }}" hint-placeholder-val="{{ false }}"><svg width="96" height="96" viewBox="0 0 64 64" fill="none" stroke="#1d989f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="12" y="8" width="26" height="48" rx="1"></rect><path d="M38 12l12 4v40l-12-4"></path><path d="M18 16l8 10"></path><path d="M18 24l5 6"></path></svg></sc-if>
      <sc-if value="{{ product.icCeiling }}" hint-placeholder-val="{{ false }}"><svg width="96" height="96" viewBox="0 0 64 64" fill="none" stroke="#1d989f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 14h52"></path><path d="M10 14l6 10h32l6-10"></path><path d="M16 24v4M48 24v4"></path><rect x="12" y="28" width="40" height="22"></rect><path d="M25 28v22M39 28v22M12 39h40"></path></svg></sc-if>
      <sc-if value="{{ product.icFire }}" hint-placeholder-val="{{ false }}"><svg width="96" height="96" viewBox="0 0 64 64" fill="none" stroke="#1d989f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="12" y="8" width="40" height="48" rx="1"></rect><path d="M32 46c-6 0-9-4-9-8 0-6 6-8 6-14 4 3 5 6 5 9 1-2 2-3 2-5 3 3 5 6 5 10 0 4-3 8-9 8z"></path></svg></sc-if>
      <span style="font-family:ui-monospace,monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#5b8a8e">FRP panel</span>
    </div></sc-if>
  </div>
  <div style="padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1">
    <div style="font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#1d989f">{{ product.cat }}</div>
    <div style="font-family:'Poppins',sans-serif;font-size:15px;font-weight:500;line-height:1.35;color:#1c2b33;text-wrap:pretty;height:2.7em;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical">{{ product.name }}</div>
    <sc-if value="{{ product.notInCart }}" hint-placeholder-val="{{ true }}">
      <button onClick="{{ product.onAdd }}" style="width:100%;height:42px;border:1px solid #1d989f;background:#1d989f;color:#ffffff;border-radius:6px;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:600;cursor:pointer;transition:background .2s" style-hover="background:#167b81">Add to Cart</button>
    </sc-if>
    <sc-if value="{{ product.inCart }}" hint-placeholder-val="{{ false }}">
      <button onClick="{{ product.onAdd }}" style="width:100%;height:42px;border:1px solid #1d989f;background:#ffffff;color:#1d989f;border-radius:6px;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:600;cursor:pointer">✓ Added to Cart</button>
    </sc-if>
  </div>
</div>
</sc-if>

<sc-if value="{{ product.isFeatured }}" hint-placeholder-val="{{ false }}">
<div data-href="{{ product.href }}" style="cursor:pointer;display:flex;flex-direction:column;gap:14px;height:100%;font-family:'DM Sans',system-ui,sans-serif">
  <div style="position:relative;aspect-ratio:3 / 4;border-radius:10px;overflow:hidden;background:#f1f5f6">
    <div style="position:absolute;inset:0;transition:transform .6s ease" style-hover="transform:scale(1.05)">
      <image-slot id="p-{{ product.id }}" shape="rect" fit="{{ product.fit }}" src="{{ product.img }}" placeholder="{{ product.ph }}"></image-slot>
    </div>
  </div>
  <div style="display:flex;align-items:center;gap:12px">
    <div style="flex:1;min-width:0">
      <div style="font-family:'Poppins',sans-serif;font-size:16px;font-weight:500;color:#1c2b33;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ product.name }}</div>
      <div style="font-size:13px;color:#5b6b73;margin-top:2px">{{ product.cat }}</div>
    </div>
    <sc-if value="{{ product.notInCart }}" hint-placeholder-val="{{ true }}">
      <button onClick="{{ product.onAdd }}" aria-label="Add to Cart" title="Add to Cart" style="flex:none;width:44px;height:44px;border:0;border-radius:50%;background:#1d989f;color:#ffffff;font-size:22px;line-height:1;cursor:pointer;transition:background .2s" style-hover="background:#167b81">+</button>
    </sc-if>
    <sc-if value="{{ product.inCart }}" hint-placeholder-val="{{ false }}">
      <button onClick="{{ product.onAdd }}" aria-label="Remove from Cart" title="Added to Cart" style="flex:none;width:44px;height:44px;border:1px solid #1d989f;border-radius:50%;background:#ffffff;color:#1d989f;font-size:16px;cursor:pointer">✓</button>
    </sc-if>
  </div>
</div>
</sc-if>

<sc-if value="{{ product.isClearance }}" hint-placeholder-val="{{ false }}">
<div data-href="{{ product.href }}" style="cursor:pointer;display:flex;flex-direction:column;background:#ffffff;border:1px solid #f0d9d4;border-radius:10px;overflow:hidden;height:100%;box-sizing:border-box;transition:border-color .25s, box-shadow .25s, transform .25s;font-family:'DM Sans',system-ui,sans-serif" style-hover="border-color:#c4452f;box-shadow:0 14px 30px rgba(196,69,47,0.12);transform:translateY(-3px)">
  <div style="background:#c4452f;color:#ffffff;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;padding:8px 14px;display:flex;justify-content:space-between;align-items:center">
    <span>Clearance</span><span style="font-weight:600;letter-spacing:.04em;text-transform:none;opacity:.9">While stocks last</span>
  </div>
  <div style="position:relative;aspect-ratio:1 / 1;background:#fbf4f2">
    <image-slot id="p-{{ product.id }}" shape="rect" fit="{{ product.fit }}" src="{{ product.img }}" placeholder="{{ product.ph }}"></image-slot>
  </div>
  <div style="padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1;border-top:1px dashed #f0d9d4">
    <div style="font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#5b6b73">{{ product.cat }}</div>
    <div style="font-family:'Poppins',sans-serif;font-size:15px;font-weight:500;line-height:1.35;color:#1c2b33;text-wrap:pretty;height:2.7em;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical">{{ product.name }}</div>
    <div style="display:flex;align-items:center;gap:8px;margin:2px 0 8px">
      <span style="flex:1;height:4px;border-radius:2px;background:#f3e2de;overflow:hidden"><span style="display:block;width:30%;height:100%;background:#c4452f"></span></span>
      <span style="font-size:12px;font-weight:600;color:#c4452f">Limited stock</span>
    </div>
    <sc-if value="{{ product.notInCart }}" hint-placeholder-val="{{ true }}">
      <button onClick="{{ product.onAdd }}" style="width:100%;height:42px;border:1px solid #1d989f;background:#1d989f;color:#ffffff;border-radius:21px;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:600;cursor:pointer;transition:background .2s" style-hover="background:#167b81">Grab the Deal</button>
    </sc-if>
    <sc-if value="{{ product.inCart }}" hint-placeholder-val="{{ false }}">
      <button onClick="{{ product.onAdd }}" style="width:100%;height:42px;border:1px solid #1d989f;background:#ffffff;color:#1d989f;border-radius:21px;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:600;cursor:pointer">✓ Added to Cart</button>
    </sc-if>
  </div>
</div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:280,&quot;height&quot;:460},&quot;product&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;,&quot;default&quot;:{&quot;id&quot;:&quot;demo&quot;,&quot;name&quot;:&quot;Wall-Hung Rimless WC&quot;,&quot;cat&quot;:&quot;WCs&quot;,&quot;ph&quot;:&quot;product shot&quot;,&quot;notInCart&quot;:true,&quot;isDefault&quot;:true}}}"></script>
</body>
</html>
